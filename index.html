<!DOCTYPE html> <html> <head> <title>My Website</title>
<style>
    body {
        background-color: #f0f0f0;
        background-image: url("background.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        margin: 0;
    }

    .title {
        text-align: center;
        margin-top: 40px;
        font-size: 42px;
        color: white;
        font-family: Arial, sans-serif;
    }

    .subtitle {
        text-align: center;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 18px;
    }

    details {
        text-align: center;
        margin-top: 40px;
    }

    summary {
        display: inline-block;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        font-size: 18px;
    }

    .dropdown-content {
        padding: 10px 20px;
        color: white;
        font-family: Arial, sans-serif;
    }

    #musicButton {
        display: block;
        margin: 25px auto;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    #musicButton:hover {
        background-color: #0056b3;
    }
</style>

</head> <body>
<h1 class="title">Marketplace COMING SOON</h1>

<p class="subtitle">creating this soon.</p>

<button id="musicButton" onclick="toggleMusic()">🎵 Play Music</button>

<audio id="backgroundMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<details>
    <summary>Items</summary>

    <div class="dropdown-content">
        <p>test1</p>
        <p>test2</p>
    </div>
</details>

<script>
    function toggleMusic() {
        const music = document.getElementById("backgroundMusic");
        const button = document.getElementById("musicButton");

        if (music.paused) {
            music.play();
            button.textContent = "⏸ Pause Music";
        } else {
            music.pause();
            button.textContent = "🎵 Play Music";
        }
    }
</script>

</body> </html>
